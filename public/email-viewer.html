  <title>Email Inbox Viewer</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow-x: hidden; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
      min-height: 100vh;
      color: #e0e0e0;
      padding: 40px 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* Header */
    .inbox-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      padding: 24px 28px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      backdrop-filter: blur(20px);
    }

    .inbox-header h1 {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, #3ecf8e, #6ee7b7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .inbox-header h1 .icon {
      font-size: 28px;
      -webkit-text-fill-color: initial;
    }

    .badge {
      background: linear-gradient(135deg, #3ecf8e, #2b825b);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      letter-spacing: 0.3px;
    }

    /* Stats bar */
    .stats-bar {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      flex: 1;
      padding: 16px 20px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }

    .stat-card .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      margin-bottom: 4px;
    }

    .stat-card .value {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }

    .stat-card .value.green { color: #3ecf8e; }
    .stat-card .value.blue { color: #60a5fa; }
    .stat-card .value.purple { color: #a78bfa; }

    /* Email card */
    .email-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      margin-bottom: 20px;
      overflow: hidden;
      transition: all 0.3s ease;
      backdrop-filter: blur(20px);
    }

    .email-card:hover {
      border-color: rgba(62, 207, 142, 0.3);
      box-shadow: 0 8px 32px rgba(62, 207, 142, 0.08);
      transform: translateY(-2px);
    }

    .email-card-header {
      padding: 20px 24px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      cursor: pointer;
      user-select: none;
    }

    .sender-avatar {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, #3ecf8e, #2b825b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(62, 207, 142, 0.25);
    }

    .email-meta {
      flex: 1;
      min-width: 0;
    }

    .email-from {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 2px;
    }

    .email-from .address {
      font-weight: 400;
      color: #888;
      font-size: 13px;
      margin-left: 6px;
    }

    .email-subject {
      font-size: 14px;
      font-weight: 500;
      color: #c0c0c0;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .email-tags {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 6px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .tag.spf-pass {
      background: rgba(62, 207, 142, 0.15);
      color: #3ecf8e;
      border: 1px solid rgba(62, 207, 142, 0.2);
    }

    .tag.dkim-none {
      background: rgba(251, 191, 36, 0.12);
      color: #fbbf24;
      border: 1px solid rgba(251, 191, 36, 0.2);
    }

    .tag.namespace {
      background: rgba(96, 165, 250, 0.12);
      color: #60a5fa;
      border: 1px solid rgba(96, 165, 250, 0.2);
    }

    .email-date {
      font-size: 12px;
      color: #666;
      white-space: nowrap;
      text-align: right;
      flex-shrink: 0;
    }

    .email-date .time {
      display: block;
      margin-top: 2px;
      color: #555;
    }

    /* Expand indicator */
    .expand-icon {
      display: inline-block;
      transition: transform 0.3s ease;
      color: #555;
      font-size: 18px;
      margin-top: 4px;
    }

    .email-card.expanded .expand-icon {
      transform: rotate(180deg);
    }

    /* Email body */
    .email-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease;
    }

    .email-card.expanded .email-body {
      max-height: 2000px;
    }

    .email-body-inner {
      padding: 0 24px 24px;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
      margin-bottom: 20px;
    }

    /* Detail rows */
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .detail-item {
      padding: 12px 14px;
      background: rgba(0,0,0,0.2);
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.04);
    }

    .detail-item .detail-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #666;
      margin-bottom: 4px;
    }

    .detail-item .detail-value {
      font-size: 13px;
      color: #ccc;
      word-break: break-all;
    }

    /* HTML Preview */
    .html-preview-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #666;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .html-preview {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .html-preview iframe {
      width: 100%;
      height: 450px;
      border: none;
      display: block;
    }

    /* Action buttons */
    .email-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .action-btn {
      padding: 8px 18px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: #ccc;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .action-btn:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }

    .action-btn.primary {
      background: linear-gradient(135deg, #3ecf8e, #2b825b);
      color: #fff;
      border-color: transparent;
    }

    .action-btn.primary:hover {
      box-shadow: 0 4px 16px rgba(62, 207, 142, 0.3);
      transform: translateY(-1px);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

    /* Responsive */
    @media (max-width: 640px) {
      body { padding: 20px 12px; }
      .detail-grid { grid-template-columns: 1fr; }
      .stats-bar { flex-direction: column; gap: 8px; }
      .inbox-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        padding: 16px 18px;
      }
      .inbox-header h1 { font-size: 18px; }
      .email-card-header { padding: 14px 16px; gap: 10px; }
      .sender-avatar { width: 40px; height: 40px; font-size: 16px; border-radius: 10px; }
      .email-date { text-align: left; font-size: 11px; }
      .email-actions { flex-wrap: wrap; }
      .action-btn { font-size: 12px; padding: 7px 14px; }
      .html-preview iframe { height: 300px; }
    }
  </style>
</head>

function formatDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function formatTime(ts) {
  const d = new Date(ts);
  return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
}

function getInitials(name) {
  return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
}

function toggleEmail(card) {
  card.classList.toggle('expanded');
}

function renderEmails() {
  const list = document.getElementById('email-list');

  emailData.emails.forEach((email, index) => {
    const senderName = email.from_parsed[0].name || 'Unknown';
    const senderAddr = email.from_parsed[0].address;

    const card = document.createElement('div');
    card.className = 'email-card';

    card.innerHTML = `
      <div class="email-card-header" onclick="toggleEmail(this.parentElement)">
        <div class="sender-avatar">${getInitials(senderName)}</div>
        <div class="email-meta">
          <div class="email-from">
            ${senderName}
            <span class="address">&lt;${senderAddr}&gt;</span>
          </div>
          <div class="email-subject">${email.subject}</div>
          <div class="email-tags">
            <span class="tag spf-pass">SPF: ${email.SPF}</span>
            <span class="tag dkim-none">DKIM: ${email.dkim}</span>
            <span class="tag namespace">ns: ${email.namespace}</span>
          </div>
        </div>
        <div style="text-align:right">
          <div class="email-date">
            ${formatDate(email.date)}
            <span class="time">${formatTime(email.date)}</span>
          </div>

        </div>
      </div>

            </div>
            <div class="detail-item">

            </div>

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => {
    const btn = event.target;
    const orig = btn.textContent;
    btn.textContent = '✅ Copied!';
    setTimeout(() => btn.textContent = orig, 1500);
  });
}

function viewSource(index) {

}
